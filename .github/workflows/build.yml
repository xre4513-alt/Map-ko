name: Auto Build Flutter India Offline Map APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Auto Build & Upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: flutter-stable-${{ runner.os }}

      - name: Scaffold Android platform files
        run: |
          set -e
          flutter config --enable-android
          flutter config --no-analytics

          # Generate android/ scaffolding into a temp dir so it never touches our code
          rm -rf /tmp/scaffold
          flutter create /tmp/scaffold --platforms=android --project-name=india_offline_map --org=com.indiamap.app

          mkdir -p android
          cp -r /tmp/scaffold/android/. android/

          mkdir -p assets lib apk-output

      - name: Force-write pubspec.yaml with all required deps
        run: |
          cat > pubspec.yaml <<'EOF'
          name: india_offline_map
          description: Offline India Map Application with GPS
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_map: ^6.1.0
            latlong2: ^0.9.0
            path_provider: ^2.1.3
            geolocator: ^11.0.0
            permission_handler: ^11.3.1
            flutter_map_cancellable_tile_provider: ^2.0.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          echo "=== pubspec.yaml written ==="
          cat pubspec.yaml

      - name: Force-write main.dart with India map + GPS
        run: |
          mkdir -p lib
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter_map/flutter_map.dart';
          import 'package:latlong2/latlong.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const IndiaMapApp());
          }

          class IndiaMapApp extends StatelessWidget {
            const IndiaMapApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'India Offline Map',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.orange),
                home: const MapScreen(),
              );
            }
          }

          class MapScreen extends StatefulWidget {
            const MapScreen({super.key});
            @override
            State<MapScreen> createState() => _MapScreenState();
          }

          class _MapScreenState extends State<MapScreen> {
            final MapController _controller = MapController();
            final LatLng _indiaCenter = const LatLng(20.5937, 78.9629);
            LatLng? _current;
            bool _loading = true;
            String _status = 'Starting...';
            StreamSubscription<Position>? _posSub;

            @override
            void initState() {
              super.initState();
              _bootstrap();
            }

            Future<void> _bootstrap() async {
              setState(() {
                _loading = true;
                _status = 'Requesting permissions...';
              });

              // Ask runtime permissions
              final loc = await Permission.location.request();
              if (!loc.isGranted) {
                setState(() {
                  _loading = false;
                  _status = 'Location permission denied';
                });
                return;
              }

              final serviceEnabled = await Geolocator.isLocationServiceEnabled();
              if (!serviceEnabled) {
                setState(() {
                  _loading = false;
                  _status = 'Please enable GPS / Location services';
                });
                return;
              }

              setState(() => _status = 'Getting current location...');

              try {
                final pos = await Geolocator.getCurrentPosition(
                  desiredAccuracy: LocationAccuracy.high,
                  timeLimit: const Duration(seconds: 20),
                );
                if (!mounted) return;
                setState(() {
                  _current = LatLng(pos.latitude, pos.longitude);
                  _loading = false;
                  _status = 'Location found';
                });
                _controller.move(_current!, 14);

                // Continuous updates
                _posSub = Geolocator.getPositionStream(
                  locationSettings: const LocationSettings(
                    accuracy: LocationAccuracy.high,
                    distanceFilter: 5,
                  ),
                ).listen((p) {
                  if (!mounted) return;
                  setState(() => _current = LatLng(p.latitude, p.longitude));
                });
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  _loading = false;
                  _status = 'Location error: $e';
                });
              }
            }

            Future<void> _recenter() async {
              if (_current == null) {
                await _bootstrap();
                return;
              }
              _controller.move(_current!, 14);
            }

            @override
            void dispose() {
              _posSub?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('India Map'),
                  backgroundColor: Colors.orange,
                ),
                body: Stack(
                  children: [
                    FlutterMap(
                      mapController: _controller,
                      options: MapOptions(
                        initialCenter: _current ?? _indiaCenter,
                        initialZoom: _current != null ? 14 : 5,
                        minZoom: 3,
                        maxZoom: 18,
                        onTap: (_, __) {},
                      ),
                      children: [
                        TileLayer(
                          urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                          userAgentPackageName: 'com.indiamap.app',
                          maxZoom: 19,
                        ),
                        if (_current != null)
                          MarkerLayer(
                            markers: [
                              Marker(
                                point: _current!,
                                width: 60,
                                height: 60,
                                child: const Icon(
                                  Icons.location_on,
                                  color: Colors.red,
                                  size: 50,
                                ),
                              ),
                            ],
                          ),
                      ],
                    ),
                    if (_loading)
                      Container(
                        color: Colors.black45,
                        alignment: Alignment.center,
                        child: const CircularProgressIndicator(color: Colors.white),
                      ),
                    Positioned(
                      left: 12,
                      right: 12,
                      bottom: 12,
                      child: Card(
                        child: Padding(
                          padding: const EdgeInsets.all(10),
                          child: Text(
                            _status,
                            style: const TextStyle(fontSize: 12),
                            textAlign: TextAlign.center,
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
                floatingActionButton: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    FloatingActionButton.small(
                      heroTag: 'zoomin',
                      onPressed: () {
                        final c = _controller.camera;
                        _controller.move(c.center, c.zoom + 1);
                      },
                      child: const Icon(Icons.add),
                    ),
                    const SizedBox(height: 8),
                    FloatingActionButton.small(
                      heroTag: 'zoomout',
                      onPressed: () {
                        final c = _controller.camera;
                        _controller.move(c.center, c.zoom - 1);
                      },
                      child: const Icon(Icons.remove),
                    ),
                    const SizedBox(height: 8),
                    FloatingActionButton(
                      heroTag: 'locate',
                      onPressed: _recenter,
                      child: const Icon(Icons.my_location),
                    ),
                  ],
                ),
              );
            }
          }
          EOF
          echo "=== main.dart written ($(wc -l < lib/main.dart) lines) ==="

      - name: Force-write AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname "$MANIFEST")"
          cat > "$MANIFEST" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="India Map"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('$MANIFEST'); print('Manifest OK')"

      - name: Configure gradle.properties
        run: |
          GP="android/gradle.properties"
          [ -f "$GP" ] || touch "$GP"
          grep -q "android.useAndroidX" "$GP" || echo "android.useAndroidX=true" >> "$GP"
          grep -q "android.enableJetifier" "$GP" || echo "android.enableJetifier=true" >> "$GP"
          grep -q "org.gradle.jvmargs" "$GP" || echo "org.gradle.jvmargs=-Xmx4096m" >> "$GP"

      - name: Fetch dependencies
        run: flutter pub get

      - name: Clean previous build
        run: flutter clean

      - name: Fetch dependencies again
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare APK output
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r' | cut -d'+' -f1)
          DATE=$(date +'%Y%m%d-%H%M')
          OUT="build/app/outputs/flutter-apk"
          mkdir -p apk-output
          for f in "$OUT"/*.apk; do
            [ -e "$f" ] || continue
            BASE=$(basename "$f" .apk)
            cp "$f" "apk-output/${BASE}-${VERSION}-${DATE}.apk"
          done
          ls -lh apk-output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-offline-map-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
